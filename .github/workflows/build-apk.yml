name: Build & Release CloudVault APK

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure AAPT2 for CI
        run: sed -i '/android.aapt2FromMavenOverride/d' gradle.properties

      - name: Build Signed Release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Prepare Clean Release APK Files
        id: prepare_apks
        run: |
          mkdir -p release-apks
          VERSION="1.0.1"
          
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "release-apks/CloudVault-v${VERSION}-arm64-v8a.apk" || true
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk "release-apks/CloudVault-v${VERSION}-armeabi-v7a.apk" || true
          cp app/build/outputs/apk/release/app-x86_64-release.apk "release-apks/CloudVault-v${VERSION}-x86_64.apk" || true
          cp app/build/outputs/apk/release/app-x86-release.apk "release-apks/CloudVault-v${VERSION}-x86.apk" || true
          cp app/build/outputs/apk/release/app-universal-release.apk "release-apks/CloudVault-v${VERSION}-universal.apk" || true
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CloudVault-Release-APKs
          path: release-apks/*.apk

      - name: Create Clean GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.prepare_apks.outputs.version }}
          name: "CloudVault v${{ steps.prepare_apks.outputs.version }}"
          body: |
            ## ☁️ CloudVault — Official Release

            ### 📦 Download & Installation
            Choose the APK tailored for your device architecture:
            - 🚀 **[`CloudVault-v${{ steps.prepare_apks.outputs.version }}-arm64-v8a.apk`](https://github.com/${{ github.repository }}/releases/download/v${{ steps.prepare_apks.outputs.version }}/CloudVault-v${{ steps.prepare_apks.outputs.version }}-arm64-v8a.apk)** — **Recommended** for modern 64-bit Android smartphones & tablets (~75% smaller).
            - 📱 **[`CloudVault-v${{ steps.prepare_apks.outputs.version }}-universal.apk`](https://github.com/${{ github.repository }}/releases/download/v${{ steps.prepare_apks.outputs.version }}/CloudVault-v${{ steps.prepare_apks.outputs.version }}-universal.apk)** — All-in-one APK compatible with all devices.
            - 📲 **[`CloudVault-v${{ steps.prepare_apks.outputs.version }}-armeabi-v7a.apk`](https://github.com/${{ github.repository }}/releases/download/v${{ steps.prepare_apks.outputs.version }}/CloudVault-v${{ steps.prepare_apks.outputs.version }}-armeabi-v7a.apk)** — 32-bit Android phones.
            - 💻 **[`CloudVault-v${{ steps.prepare_apks.outputs.version }}-x86_64.apk`](https://github.com/${{ github.repository }}/releases/download/v${{ steps.prepare_apks.outputs.version }}/CloudVault-v${{ steps.prepare_apks.outputs.version }}-x86_64.apk)** — 64-bit Chromebooks & Emulators.
            - 🖥️ **[`CloudVault-v${{ steps.prepare_apks.outputs.version }}-x86.apk`](https://github.com/${{ github.repository }}/releases/download/v${{ steps.prepare_apks.outputs.version }}/CloudVault-v${{ steps.prepare_apks.outputs.version }}-x86.apk)** — 32-bit Emulators.

            ---

            ### ✨ Highlights & Features
            - 🎬 **Instant 4K/1080p Video Streaming**: Direct playback from Telegram Cloud via LibVLC with subtitle & audio track switching, multi-part ZIP streaming.
            - 📖 **In-App Document & PDF Reader**: Smooth book-style horizontal swiping (`ViewPager2`), pinch-to-zoom (up to 6x), double-tap, and orientation toggle.
            - 🎵 **Background Audio & Mini-Player**: Floating mini-player bar, queue management, ID3 album artwork extraction, and sleep timer.
            - 🎨 **9 Vibrant Themes**: Dynamic ThemePalette supporting Monet Material You, AMOLED Pure Black, Midnight Purple, Emerald Forest, and more.
            - 🖼️ **Media Gallery & Grid Zoom**: Timeline view with Day, Month, and Year zoom modes.
            - 🔄 **Auto-Backup & Sync**: Automatic camera folder sync to private Telegram Cloud.
            - 🔍 **Duplicate Finder**: 1-tap deduplication scanner using file checksums.
            - 📤 **Android System Share Target**: Backup files directly from your gallery or browser.
          files: release-apks/*.apk
          draft: false
          prerelease: false
          make_latest: true
