name: Build & Release CloudVault APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug -Pandroid.aapt2FromMavenOverride="" --no-daemon


      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudVault-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Get Short SHA
        id: slug
        run: echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with APK
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build.${{ github.run_number }}
          name: "CloudVault v1.0.0 (Build #${{ github.run_number }})"
          body: |
            ## ☁️ CloudVault - Auto Build Release

            **Commit:** `${{ steps.slug.outputs.sha }}`

            ### Features Included
            - **TDLib Integration**: Native MTProto client engine supporting photos, videos, and documents.
            - **On-Demand Range Proxy**: HTTP socket proxy for instant byte-range streaming without full download.
            - **ExoPlayer Integration**: Direct streaming video playback.
            - **Cloud Gallery**: Tabbed interface for Photos, Videos, and Files.

            ### Download & Install
            Download `app-debug.apk` below and install it directly on your Android device.
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
